<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#grad3)"/>
  
  <!-- Desktop monitor -->
  <rect x="100" y="80" width="220" height="140" fill="#ffffff" stroke="#0b6e4f" stroke-width="3" rx="4"/>
  <rect x="100" y="80" width="220" height="20" fill="#0b6e4f"/>
  <line x1="195" y1="220" x2="225" y2="250" stroke="#0b6e4f" stroke-width="3"/>
  <rect x="165" y="250" width="90" height="10" fill="#0b6e4f" rx="2"/>
  
  <!-- Mobile phone -->
  <rect x="340" y="100" width="100" height="180" fill="#ffffff" stroke="#2c5a07" stroke-width="3" rx="8"/>
  <rect x="340" y="100" width="100" height="15" fill="#2c5a07" rx="8"/>
  <circle cx="390" cy="270" r="8" fill="#2c5a07"/>
  
  <!-- Connection lines -->
  <path d="M 320,150 Q 330,150 340,150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  
  <text x="50%" y="95%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0b6e4f" font-weight="bold">Digital Interaction</text>
</svg>
