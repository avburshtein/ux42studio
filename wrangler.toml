name = "ux42next"
main = ".open-next/worker.js"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[[d1_databases]]
binding = "DB"
database_name = "ux42-portfolio-db"
database_id = "67d7cb5f-5397-48b6-ae54-f7ac877e251e"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "ux42-assets"

[[routes]]
pattern = "ux42.studio"
custom_domain = true

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "ux42next"

[observability]
enabled = true