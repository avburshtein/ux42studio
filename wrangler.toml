name = "ux42next"
main = ".open-next/worker.js"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[[d1_databases]]
binding = "DB"
database_name = "ux42-portfolio-db"
database_id = "67d7cb5f-5397-48b6-ae54-f7ac877e251e"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "ux42-assets"

[[routes]]
pattern = "ux42.studio"
custom_domain = true

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

# Несекретные переменные (решение (69)): slug профиля студии — чьи кейсы
# показываются на главной / и чья страница служит примером на /platform.
# Если значение не задано, код берёт самый ранний профиль (createdAt asc).
[vars]
STUDIO_PROFILE_SLUG = "aleksandra-burshtein"

# Адрес отправителя писем (приглашения + «аккаунт создан»). Домен должен
# быть подтверждён у провайдера почты. Формат поддерживает имя:
# "UX42 Studio <no-reply@ux42.studio>".
EMAIL_FROM = "UX42 Studio <no-reply@ux42.studio>"
EMAIL_FROM_NAME = "UX42 Studio"

# Публичный адрес сайта — используется в ссылках внутри писем.
APP_URL = "https://ux42.studio"

# Отправка писем через Cloudflare Email Service. Раскомментировать, если
# тариф Workers Paid, а домен включён командой
# `npx wrangler email sending enable ux42.studio`. На Workers Free Email
# Sending недоступен (Pricing: Email Sending = only Paid), поэтому по
# умолчанию используется HTTP-провайдер (RESEND_API_KEY как secret).
# Таблица должна быть на верхнем уровне файла, не внутри [vars].
#
# [[send_email]]
# name = "EMAIL"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "ux42next"

[observability]
enabled = true